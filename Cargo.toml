[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.99"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lopdf = "=0.44.0"
pdfium-render = { version = "=0.9.4", default-features = false, features = ["pdfium_7881", "image_025"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tempfile = "3"
zeroize = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
strip = true

